name: Renovar token do Instagram

on:
  schedule:
    # Toda segunda-feira às 03:00 UTC. O token dura ~60 dias e só pode ser
    # renovado depois de 24h de vida, então renovar 1x por semana é bem
    # seguro (nunca deixa passar perto da data de expiração).
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Renovar token e atualizar o Secret no GitHub
        run: node scripts/refresh-instagram-token.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
